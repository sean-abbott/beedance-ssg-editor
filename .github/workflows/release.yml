name: Release

# Versioning is Cargo's job, not a separately-maintained number here:
# tauri.conf.json has no "version" field of its own, so Tauri falls back to
# src-tauri/Cargo.toml's package version automatically (verified directly
# from tauri-utils' own Config struct doc comment, not assumed) - bump the
# version there, push to the "release" branch (a fast-forward from main
# when you're actually ready to cut one, not every routine commit), and
# tauri-action below reads that version, creates/updates the matching
# "app-v<version>" tag and a draft GitHub Release, and attaches the built
# installers - no separate manual tagging step. workflow_dispatch is there
# too for a manual one-off rebuild.
#
# Free on GitHub-hosted "standard" runners (this matrix only uses those, not
# the separately-priced "larger runners") for a public repository, on every
# OS including macOS/Windows - verified against GitHub's own billing docs
# 2026-09-27, not assumed.
on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-26.04"
            target: ""
          - platform: "windows-latest"
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Same package list as build.Dockerfile (already verified working
      # there), plus patchelf/xdg-utils, which that image never needed since
      # it only ever ran `cargo check`, never a real bundle (AppImage
      # creation needs patchelf; the .desktop entry needs xdg-utils).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # This app has no JS build step at all (dist/ is plain HTML/JS/CSS,
      # see the README) - no setup-node/npm install step needed here, unlike
      # most Tauri app CI recipes.

      # Windows runners default new steps to PowerShell - `shell: bash`
      # picks up the Git Bash already installed there, same as this script
      # already supports for a local Windows dev with Git Bash/MSYS/WSL.
      #
      # ZOLA_TARGET_TRIPLE is set to matrix.target for every row (empty for
      # the ubuntu/windows rows, which build for their host's own native
      # arch - the script's uname-based auto-detection already gets those
      # right, and an empty value is treated the same as unset). It only
      # actually changes anything for the macos-latest x86_64-apple-darwin
      # row: that runner's host is Apple Silicon, so uname -m there would
      # otherwise fetch the aarch64 sidecar and Tauri's build would fail
      # looking for the x86_64 one it actually needs - found the hard way on
      # the first real run.
      - name: Fetch the Zola sidecar
        shell: bash
        env:
          ZOLA_TARGET_TRIPLE: ${{ matrix.target }}
        run: ./scripts/fetch-zola-sidecar.sh

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "beedance-ssg-editor v__VERSION__"
          releaseBody: |
            See the assets below to download and install - macOS
            (`aarch64` for Apple Silicon, `x86_64` for Intel), Windows
            (`.msi`), or Linux (`.deb`/`.rpm`/`.AppImage`). See the README's
            "Install" section for first-run instructions.
          releaseDraft: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
