<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview Server Log</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #1c1c1e;
      color: #eaeaec;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 6px;
      background: #222329;
      border-bottom: 1px solid #35363c;
    }
    #toolbar button {
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      background: #2a2b31;
      color: #eaeaec;
      border: 1px solid #35363c;
      border-radius: 6px;
    }
    #toolbar button:hover { filter: brightness(1.15); }
    #log {
      margin: 0;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      height: calc(100% - 37px);
      overflow: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="clear">Clear</button>
  </div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById("log");

    window.__TAURI__.event.listen("zola-log", (event) => {
      logEl.textContent += event.payload + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    });

    // Emitted by the Rust side each time "Start preview" (re)launches the
    // zola serve process, so this window's log stays in sync with the
    // actual running instance instead of showing stale lines from a
    // previous run.
    window.__TAURI__.event.listen("zola-log-reset", () => {
      logEl.textContent = "";
    });

    document.getElementById("clear").addEventListener("click", () => {
      logEl.textContent = "";
    });
  </script>
</body>
</html>
