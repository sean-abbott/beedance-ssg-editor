<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview log</title>
  <!-- Same reasoning as index.html's own copy of this script - avoids a
       visible flash of the Blue theme before theme.js's async settings
       fetch settles on Bee. -->
  <script>try { if (localStorage.getItem("beedance-theme") === "bee") document.documentElement.setAttribute("data-theme", "bee"); } catch (e) {}</script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 6px;
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
    }
    #toolbar button { font: inherit; font-size: 12px; }
    #log {
      margin: 0;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      height: calc(100% - 37px);
      overflow: auto;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="bee-stripe"></div>
  <div id="toolbar">
    <button id="clear">Clear</button>
  </div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById("log");

    // Set by the Rust side's initialization_script before this page's own
    // script runs, with whatever lines already arrived before this window
    // existed to hear them (e.g. the preview server was already running
    // when "Preview log" was clicked).
    if (window.__BEEDANCE_LOG_BACKLOG__ && window.__BEEDANCE_LOG_BACKLOG__.length) {
      logEl.textContent = window.__BEEDANCE_LOG_BACKLOG__.join("\n") + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.__TAURI__.event.listen("zola-log", (event) => {
      logEl.textContent += event.payload + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    });

    // Emitted by the Rust side each time "Start preview" (re)launches the
    // zola serve process, so this window's log stays in sync with the
    // actual running instance instead of showing stale lines from a
    // previous run.
    window.__TAURI__.event.listen("zola-log-reset", () => {
      logEl.textContent = "";
    });

    document.getElementById("clear").addEventListener("click", () => {
      logEl.textContent = "";
    });
  </script>
  <script type="module" src="theme.js"></script>
</body>
</html>
