<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 6px;
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
    }
    #toolbar button {
      font-size: 15px;
      padding: 4px 10px;
    }
    #frame { width: 100%; height: calc(100% - 39px); border: none; display: block; }
  </style>
</head>
<body>
  <div class="bee-stripe"></div>
  <div id="toolbar">
    <button id="back" title="Back" aria-label="Back">&larr;</button>
    <button id="forward" title="Forward" aria-label="Forward">&rarr;</button>
    <button id="reload" title="Reload" aria-label="Reload">&#8635;</button>
  </div>
  <iframe id="frame"></iframe>

  <script>
    const frame = document.getElementById("frame");

    // No fixed port - zola_serve picks a fresh free one every run (see
    // preview.rs), passed in via this injected variable at window creation
    // and again on every "preview-navigate" (a site/tab switch reusing this
    // same window always implies a fresh port, since zola_serve always
    // picks a new one).
    let currentPort = window.__BEEDANCE_PREVIEW_PORT__;
    let currentPath = window.__BEEDANCE_PREVIEW_TARGET__ || "/";

    // The embedded webview's HTTP cache (WKWebView on macOS in particular)
    // persists across app restarts, tied to a shared on-disk data store, not
    // to this one window - so a genuinely fresh preview window can still
    // serve a stale cached response left over from an earlier session (e.g.
    // before switching to a different site), even though zola itself is
    // serving fresh content. Found the hard way testing on a real Mac. A
    // cache-busting query param makes every navigation a byte-different
    // URL, forcing a real network fetch instead of a cache hit, regardless
    // of what an earlier session cached.
    const navigateFrame = (path, port) => {
      currentPath = path;
      currentPort = port;
      const separator = path.includes("?") ? "&" : "?";
      frame.src = `http://127.0.0.1:${port}${path}${separator}_t=${Date.now()}`;
    };

    navigateFrame(currentPath, currentPort);

    // "Start preview" clicked again while this window was already open (e.g.
    // after switching tabs, or after switching sites, which always means a
    // new port too) - navigate in place instead of needing a reopen.
    window.__TAURI__.event.listen("preview-navigate", (event) => {
      navigateFrame(event.payload.path, event.payload.port);
    });

    // history.back()/forward() are allowed cross-origin per spec even though
    // the iframe (127.0.0.1:<port>) and this page (tauri's own origin) differ.
    document.getElementById("back").addEventListener("click", () => {
      frame.contentWindow.history.back();
    });
    document.getElementById("forward").addEventListener("click", () => {
      frame.contentWindow.history.forward();
    });

    // Re-navigating to a remembered currentPath/currentPort (the old
    // approach here) reloads wherever the preview was LAST explicitly
    // pointed - the page open when "Start preview" fired, or wherever
    // "preview-navigate" last sent it - not wherever the user has since
    // clicked to inside the iframe, since currentPath/currentPort are only
    // ever updated by navigateFrame itself, never by the iframe's own
    // internal navigation (which this page can't observe: the iframe
    // (127.0.0.1:<port>) and this page are different origins, and
    // location/href reads are blocked cross-origin even though a few
    // specific navigation methods are allowlisted through). history.go(0)
    // is a reload of whatever page is ACTUALLY showing right now, using
    // that same cross-origin-legal history API as back()/forward() below,
    // rather than re-deriving "current" from state this page can't track.
    document.getElementById("reload").addEventListener("click", () => {
      frame.contentWindow.history.go(0);
    });
  </script>
  <script type="module" src="theme.js"></script>
</body>
</html>
