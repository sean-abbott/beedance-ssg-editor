<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>beedance-ssg-editor</title>
</head>
<body>
  <h1>beedance-ssg-editor</h1>

  <section>
    <h2>pws-fgf.2: Zola sidecar</h2>
    <button id="check">Run zola --version</button>
    <pre id="result">(not run yet)</pre>
  </section>

  <section>
    <h2>pws-fgf.4: git-backed content (sample-site/, its own repo)</h2>

    <p>
      Current branch:
      <button id="branch">refresh</button>
      <span id="branch-result">(not run yet)</span>
    </p>

    <p>
      <input id="draft-name" type="text" placeholder="draft name" size="20" />
      <button id="start-draft">Start a draft</button>
      <span id="draft-result"></span>
    </p>

    <button id="status">git status</button>
    <pre id="status-result">(not run yet)</pre>

    <input id="commit-msg" type="text" placeholder="commit message" size="40" />
    <button id="commit">git commit</button>
    <pre id="commit-result">(not run yet)</pre>
  </section>

  <section>
    <h2>pws-fgf.3: live preview (zola serve)</h2>
    <button id="preview-start">Start preview</button>
    <button id="preview-stop">Stop preview</button>
    <span id="preview-result"></span>
    <br />
    <iframe id="preview-frame" src="about:blank" width="900" height="500" style="border: 1px solid gray; margin-top: 8px;"></iframe>
  </section>

  <script>
    const { invoke } = window.__TAURI__.core;

    const wire = (buttonId, resultId, run) => {
      document.getElementById(buttonId).addEventListener("click", async () => {
        const el = document.getElementById(resultId);
        try {
          el.textContent = await run();
        } catch (err) {
          el.textContent = "ERROR: " + err;
        }
      });
    };

    wire("check", "result", () => invoke("zola_version"));
    wire("branch", "branch-result", () => invoke("current_branch"));
    wire("status", "status-result", () => invoke("git_status"));

    wire("commit", "commit-result", () => {
      const message = document.getElementById("commit-msg").value || "Update from beedance-ssg-editor";
      return invoke("git_commit", { message });
    });

    wire("start-draft", "draft-result", () => {
      const name = document.getElementById("draft-name").value || "untitled";
      return invoke("start_draft", { name });
    });

    document.getElementById("preview-start").addEventListener("click", async () => {
      const el = document.getElementById("preview-result");
      try {
        el.textContent = await invoke("zola_serve");
        // give the server a moment to bind before pointing the iframe at it
        setTimeout(() => {
          document.getElementById("preview-frame").src = "http://127.0.0.1:1111";
        }, 500);
      } catch (err) {
        el.textContent = "ERROR: " + err;
      }
    });

    document.getElementById("preview-stop").addEventListener("click", async () => {
      const el = document.getElementById("preview-result");
      try {
        el.textContent = await invoke("zola_stop");
        document.getElementById("preview-frame").src = "about:blank";
      } catch (err) {
        el.textContent = "ERROR: " + err;
      }
    });
  </script>
</body>
</html>
