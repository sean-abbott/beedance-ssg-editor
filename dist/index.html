<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>beedance-ssg-editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #ddd;
      --text: #1c1c1e;
      --muted: #6b6b70;
      --accent: #3a6ff7;
      --accent-text: #ffffff;
      --banner-bg: #fff6d8;
      --banner-border: #e6c65c;
      --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --panel: #222329;
        --border: #35363c;
        --text: #eaeaec;
        --muted: #9a9aa2;
        --banner-bg: #3a331a;
        --banner-border: #6b5a24;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }

    main { padding: 16px 20px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .toolbar .status { margin-left: auto; color: var(--muted); font-size: 13px; }
    .toolbar .status.dirty { color: #b8860b; font-weight: 600; }

    button, select, input[type=text] {
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: var(--panel); color: var(--text); border-color: var(--border); }

    .row { display: flex; gap: 12px; align-items: stretch; }
    .col { flex: 1 1 0; min-width: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel h3 {
      margin: 0;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 92%, var(--text));
    }

    #tab-bar {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      background: color-mix(in srgb, var(--panel) 92%, var(--text));
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 6px 6px 0;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      padding: 6px 8px 6px 10px;
      font-size: 12px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      color: var(--muted);
    }
    .tab:hover { background: var(--bg); }
    .tab.active {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
      font-weight: 600;
    }
    .tab .tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .tab-dot { color: #b8860b; flex-shrink: 0; }
    .tab .tab-external-dot { color: #c0392b; flex-shrink: 0; }
    .tab .tab-close {
      border: none;
      background: none;
      color: inherit;
      font-size: 13px;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tab .tab-close:hover { color: #c0392b; }

    #editor {
      width: 100%;
      height: 500px;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      border: none;
      padding: 12px;
      resize: none;
      background: var(--panel);
      color: var(--text);
    }
    #editor:focus { outline: none; }

    #external-change-banner {
      display: none;
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin: 0 20px 12px;
      font-size: 13px;
    }
    #external-change-banner button { margin-left: 8px; }

    details {
      margin: 0 20px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    details summary { cursor: pointer; padding: 6px 0; }
    details section { padding: 8px 0; }
    details h3 { font-size: 12px; margin: 0 0 6px; color: var(--muted); }
    details pre {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      font-size: 12px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>beedance-ssg-editor</h1>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
      <div id="site-dir" style="font-size: 12px; color: var(--muted);">(loading...)</div>
      <button id="change-site" class="secondary" style="font-size: 11px; padding: 2px 8px;">Change site&hellip;</button>
    </div>
  </header>

  <div id="external-change-banner">
    <span id="external-change-message">File changed on disk externally.</span>
    <button id="banner-reload" class="secondary">Reload</button>
    <button id="banner-dismiss" class="secondary">Ignore</button>
  </div>

  <details>
    <summary>debug tools</summary>

    <section>
      <h3>Zola sidecar</h3>
      <button id="check" class="secondary">Run zola --version</button>
      <pre id="result">(not run yet)</pre>
    </section>

    <section>
      <h3>git-backed content (sample-site/, its own repo)</h3>

      <p>
        Current branch:
        <button id="branch" class="secondary">refresh</button>
        <span id="branch-result">(not run yet)</span>
      </p>

      <p>
        <input id="draft-name" type="text" placeholder="draft name" size="20" />
        <button id="start-draft" class="secondary">Start a draft</button>
        <span id="draft-result"></span>
      </p>

      <button id="status" class="secondary">git status</button>
      <pre id="status-result">(not run yet)</pre>

      <input id="commit-msg" type="text" placeholder="commit message" size="40" />
      <button id="commit" class="secondary">git commit</button>
      <pre id="commit-result">(not run yet)</pre>
    </section>
  </details>

  <main>
    <div class="toolbar">
      <button id="preview-start">Start preview</button>
      <button id="preview-stop" class="secondary">Stop preview</button>
      <label>
        Open file:
        <select id="file-select"></select>
        <button id="refresh-files" class="secondary" title="Rescan for template files (e.g. after just add-theme)">rescan</button>
      </label>
      <label><input type="checkbox" id="phone-toggle" /> Phone preview</label>
      <button id="reload" class="secondary">Reload from disk</button>
      <button id="save">Save</button>
      <span id="editor-status" class="status"></span>
    </div>

    <div id="tab-bar"></div>
    <div class="panel" style="border-radius: 0 0 var(--radius) var(--radius);">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <details style="margin: 12px 0 0;">
      <summary>zola serve log</summary>
      <pre id="zola-log">(nothing yet)</pre>
    </details>
  </main>

  <script>
    const { invoke } = window.__TAURI__.core;

    const wire = (buttonId, resultId, run) => {
      document.getElementById(buttonId).addEventListener("click", async () => {
        const el = document.getElementById(resultId);
        try {
          el.textContent = await run();
        } catch (err) {
          el.textContent = "ERROR: " + err;
        }
      });
    };

    wire("check", "result", () => invoke("zola_version"));
    wire("branch", "branch-result", () => invoke("current_branch"));
    wire("status", "status-result", () => invoke("git_status"));

    wire("commit", "commit-result", () => {
      const message = document.getElementById("commit-msg").value || "Update from beedance-ssg-editor";
      return invoke("git_commit", { message });
    });

    wire("start-draft", "draft-result", () => {
      const name = document.getElementById("draft-name").value || "untitled";
      return invoke("start_draft", { name });
    });

    const zolaLog = document.getElementById("zola-log");

    document.getElementById("preview-start").addEventListener("click", async () => {
      const status = document.getElementById("editor-status");
      zolaLog.textContent = "";
      try {
        await invoke("zola_serve");
        status.textContent = "";
      } catch (err) {
        status.textContent = "ERROR: " + err;
      }
    });

    document.getElementById("preview-stop").addEventListener("click", async () => {
      const status = document.getElementById("editor-status");
      try {
        await invoke("zola_stop");
        document.getElementById("phone-toggle").checked = false;
      } catch (err) {
        status.textContent = "ERROR: " + err;
      }
    });

    document.getElementById("phone-toggle").addEventListener("change", async (e) => {
      const status = document.getElementById("editor-status");
      try {
        await invoke("set_preview_phone_mode", { phone: e.target.checked });
      } catch (err) {
        status.textContent = "ERROR: " + err;
        e.target.checked = !e.target.checked;
      }
    });

    const fileSelect = document.getElementById("file-select");
    const editorEl = document.getElementById("editor");
    const tabBar = document.getElementById("tab-bar");
    const statusEl = document.getElementById("editor-status");
    const banner = document.getElementById("external-change-banner");
    const bannerMessage = document.getElementById("external-change-message");

    // Every open file is its own tab with its own buffer/dirty/autosave-timer/
    // external-change state, keyed by site-relative path.
    const tabs = new Map();
    let activeTab = null;
    const AUTOSAVE_DELAY_MS = 1200;

    const refreshFileList = async () => {
      const previous = fileSelect.value;
      const files = await invoke("list_editable_files");
      fileSelect.innerHTML = "";
      for (const f of files) {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        fileSelect.appendChild(opt);
      }
      if (files.includes(previous)) fileSelect.value = previous;
    };

    const renderTabBar = () => {
      tabBar.innerHTML = "";
      for (const [path, tab] of tabs) {
        const el = document.createElement("div");
        el.className = "tab" + (path === activeTab ? " active" : "");
        el.title = path;

        if (tab.dirty) {
          const dot = document.createElement("span");
          dot.className = "tab-dot";
          dot.textContent = "●";
          el.appendChild(dot);
        } else if (tab.externallyChanged) {
          const dot = document.createElement("span");
          dot.className = "tab-external-dot";
          dot.textContent = "●";
          el.appendChild(dot);
        }

        const label = document.createElement("span");
        label.className = "tab-label";
        label.textContent = path;
        el.appendChild(label);

        const close = document.createElement("button");
        close.className = "tab-close";
        close.textContent = "×";
        close.setAttribute("aria-label", "Close " + path);
        close.addEventListener("click", (e) => {
          e.stopPropagation();
          closeTab(path);
        });
        el.appendChild(close);

        el.addEventListener("click", () => switchToTab(path));
        tabBar.appendChild(el);
      }
    };

    const updateStatusForActiveTab = () => {
      statusEl.classList.remove("dirty");
      if (!activeTab) {
        statusEl.textContent = "";
        return;
      }
      const tab = tabs.get(activeTab);
      if (tab.dirty) {
        statusEl.classList.add("dirty");
        statusEl.textContent = "● unsaved changes";
      } else {
        statusEl.textContent = "";
      }
    };

    const switchToTab = (path) => {
      const tab = tabs.get(path);
      if (!tab) return;
      activeTab = path;
      editorEl.value = tab.content;
      editorEl.disabled = false;
      updateStatusForActiveTab();
      renderTabBar();
      if (tab.externallyChanged) {
        bannerMessage.textContent = path + " changed on disk externally.";
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    };

    const openTab = async (path) => {
      if (tabs.has(path)) {
        switchToTab(path);
        return;
      }
      try {
        const content = await invoke("read_file", { path });
        tabs.set(path, { content, dirty: false, timer: null, externallyChanged: false });
        switchToTab(path);
      } catch (err) {
        statusEl.textContent = "ERROR: " + err;
      }
    };

    const doSave = async (path, content) => {
      const tab = tabs.get(path);
      try {
        await invoke("write_file", { path, content });
        if (tab) tab.dirty = false;
        if (path === activeTab) updateStatusForActiveTab();
        renderTabBar();
      } catch (err) {
        if (path === activeTab) statusEl.textContent = "ERROR: " + err;
      }
    };

    const flushTab = (path) => {
      const tab = tabs.get(path);
      if (!tab) return;
      if (tab.timer) {
        clearTimeout(tab.timer);
        tab.timer = null;
        doSave(path, tab.content);
      }
    };

    const cancelTabAutosave = (path) => {
      const tab = tabs.get(path);
      if (tab && tab.timer) {
        clearTimeout(tab.timer);
        tab.timer = null;
      }
    };

    const closeTab = (path) => {
      flushTab(path);
      invoke("close_file", { path }).catch(() => {});
      tabs.delete(path);

      if (activeTab === path) {
        const remaining = [...tabs.keys()];
        if (remaining.length > 0) {
          switchToTab(remaining[remaining.length - 1]);
        } else {
          activeTab = null;
          editorEl.value = "";
          editorEl.disabled = true;
          banner.style.display = "none";
          updateStatusForActiveTab();
          renderTabBar();
        }
      } else {
        renderTabBar();
      }
    };

    editorEl.addEventListener("input", () => {
      if (!activeTab) return;
      const tab = tabs.get(activeTab);
      tab.content = editorEl.value;
      tab.dirty = true;
      updateStatusForActiveTab();
      renderTabBar();

      clearTimeout(tab.timer);
      const path = activeTab;
      tab.timer = setTimeout(() => {
        tab.timer = null;
        doSave(path, tab.content);
      }, AUTOSAVE_DELAY_MS);
    });

    window.addEventListener("beforeunload", () => {
      for (const path of tabs.keys()) flushTab(path);
    });

    document.getElementById("reload").addEventListener("click", async () => {
      if (!activeTab) return;
      const path = activeTab;
      cancelTabAutosave(path);
      try {
        const content = await invoke("read_file", { path });
        const tab = tabs.get(path);
        tab.content = content;
        tab.dirty = false;
        tab.externallyChanged = false;
        if (path === activeTab) {
          editorEl.value = content;
          updateStatusForActiveTab();
          banner.style.display = "none";
        }
        renderTabBar();
      } catch (err) {
        statusEl.textContent = "ERROR: " + err;
      }
    });

    document.getElementById("refresh-files").addEventListener("click", refreshFileList);

    fileSelect.addEventListener("change", () => openTab(fileSelect.value));

    document.getElementById("save").addEventListener("click", () => {
      if (!activeTab) return;
      cancelTabAutosave(activeTab);
      doSave(activeTab, editorEl.value);
    });

    const siteDirEl = document.getElementById("site-dir");

    invoke("get_site_dir").then((dir) => {
      siteDirEl.textContent = dir;
    });

    refreshFileList().then(() => {
      if (fileSelect.value) openTab(fileSelect.value);
    });

    document.getElementById("change-site").addEventListener("click", async () => {
      try {
        const folder = await window.__TAURI__.dialog.open({
          directory: true,
          multiple: false,
          title: "Choose site directory",
        });
        if (!folder) return;

        // Leaving the current site entirely - flush and close every open tab
        // against it (closeTab already saves pending edits and tells the
        // backend to stop tracking each path) before switching underneath.
        for (const path of [...tabs.keys()]) closeTab(path);

        await invoke("zola_stop");
        document.getElementById("phone-toggle").checked = false;
        zolaLog.textContent = "";

        const result = await invoke("set_site_dir", { path: folder });
        siteDirEl.textContent = result;

        await refreshFileList();
        if (fileSelect.value) openTab(fileSelect.value);
      } catch (err) {
        siteDirEl.textContent = "ERROR: " + err;
      }
    });

    const { listen } = window.__TAURI__.event;

    listen("content-file-changed", (event) => {
      const path = event.payload;
      const tab = tabs.get(path);
      if (!tab) return;
      tab.externallyChanged = true;
      renderTabBar();
      if (path === activeTab) {
        bannerMessage.textContent = path + " changed on disk externally.";
        banner.style.display = "block";
      }
    });

    listen("zola-log", (event) => {
      zolaLog.textContent += event.payload + "\n";
    });

    document.getElementById("banner-reload").addEventListener("click", () => {
      document.getElementById("reload").click();
    });

    document.getElementById("banner-dismiss").addEventListener("click", () => {
      if (activeTab) {
        const tab = tabs.get(activeTab);
        if (tab) tab.externallyChanged = false;
        renderTabBar();
      }
      banner.style.display = "none";
    });
  </script>
</body>
</html>
