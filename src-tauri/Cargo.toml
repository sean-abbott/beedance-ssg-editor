[package]
name = "beedance-ssg-editor"
version = "0.1.0"
description = "Git+markdown-backed desktop static site editor (Tauri sidecar-SSG spike)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[[bin]]
name = "beedance-ssg-editor"
path = "src/main.rs"
