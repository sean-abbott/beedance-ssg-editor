[package]
name = "beedance-ssg-editor"
version = "0.1.0"
description = "Git+markdown-backed desktop static site editor (Tauri sidecar-SSG spike)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "7"
image = "0.25"
base64 = "0.23"
local-ip-address = "0.6"
ureq = "3"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }

[[bin]]
name = "beedance-ssg-editor"
path = "src/main.rs"
